name: New prompt idea
description: Suggest a new prompt or collection for the library.
title: "[new prompt] "
labels: ["new prompt"]
body:
  - type: markdown
    attributes:
      value: |
        Want to write it yourself? See [CONTRIBUTING.md](https://github.com/roalexandru/pmnotes.ai/blob/main/CONTRIBUTING.md); pull requests are welcome.
  - type: input
    id: title
    attributes:
      label: Working title
      placeholder: Pricing page teardown
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where it fits in a PM's workflow.
      options:
        - discovery (strategy, research, requirements)
        - prototyping (building prototypes, schemas, components)
        - execution (analysis, testing, launch, automation)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: What the PM is trying to get done, and when they'd reach for this prompt.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      description: What the user would fill in (one per line).
      placeholder: |
        Product name
        Competitor pricing pages (pasted text)
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: What a good answer looks like (sections, tables, code).
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Related prompts
      description: Existing pmnotes.ai prompts that come close, and why they aren't enough.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to write this prompt and open a pull request.
          required: false
