name: Validate prompts

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel validation of pushes to main: that's what the live site reads.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On same-repo PRs, check out the branch itself so regenerated indexes can be pushed back.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Regenerate indexes (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run index
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prompts/index.json prompts/search.json collections/index.json
          # The indexes are a pure function of the content, so this only commits when a
          # contributor forgot `npm run index`. Note: a push made with GITHUB_TOKEN does
          # not start a new run, so the bot commit itself shows no checks.
          if git diff --staged --quiet; then
            echo "Indexes already up to date"
          else
            git commit -m "chore: regenerate prompt and collection indexes"
            git push
            echo "::notice::Indexes were out of date and have been regenerated in a bot commit. Pull before pushing again."
          fi

      - name: Validate content and indexes
        run: npm run validate

      - name: Run tests
        run: npm test

  # Rebuilds the website on Cloudflare Pages so prerendered pages and the sitemap pick
  # up new or renamed prompts. (Prompt content is read live, so it doesn't wait for this.)
  # Setup: Cloudflare Pages > project > Settings > Builds > Deploy hooks, then add the
  # hook URL as the repository secret CF_PAGES_DEPLOY_HOOK. See README > Deploy hook.
  deploy-website:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::CF_PAGES_DEPLOY_HOOK is not set, so the website was not rebuilt. See README > Deploy hook."
            exit 0
          fi
          # The hook URL is the secret: never echo it. The response is discarded too.
          curl -fsS -X POST -o /dev/null "$HOOK"
          echo "Website rebuild triggered."
